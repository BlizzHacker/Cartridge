# RetroArch configuration optimized for Onn 4K Streaming Box (Android 14, Amlogic S905Y4, 32-bit ARM)
# Supports 1-4 Xbox Wireless / Bluetooth / USB Controllers out of the box.

# Video (OpenGL ES 3 + Threaded Video for smooth 60fps N64 / SNES / PS1 on Mali-G31)
video_driver = "gl"
video_threaded = "true"
video_vsync = "true"
video_smooth = "true"
video_fullscreen = "true"
video_scale_integer = "false"
aspect_ratio_index = "22"

# Sleek Console UI (Ozone)
menu_driver = "ozone"
ozone_menu_color_theme = "1"
menu_show_load_core = "true"
menu_show_online_updater = "true"
menu_show_core_updater = "true"
rgui_show_start_screen = "false"

# Audio
audio_driver = "opensl"
audio_sync = "true"
audio_latency = "64"

# 4-Player Xbox Controller Setup
input_driver = "android"
input_joypad_driver = "android"
input_autodetect_enable = "true"
input_max_users = "4"
all_users_control_menu = "true"
input_menu_toggle_gamepad_combo = "2"
input_quit_gamepad_combo = "0"
input_remap_binds_enable = "true"
input_player1_analog_dpad_mode = "1"
input_player2_analog_dpad_mode = "1"
input_player3_analog_dpad_mode = "1"
input_player4_analog_dpad_mode = "1"
input_player1_joypad_index = "0"
input_player2_joypad_index = "1"
input_player3_joypad_index = "2"
input_player4_joypad_index = "3"
input_overlay_enable = "false"
input_overlay_hide_in_menu = "true"

# Performance & Saves
rewind_enable = "false"
savestate_auto_save = "false"
savestate_auto_load = "false"
config_save_on_exit = "true"
core_updater_buildbot_cores_url = "https://buildbot.libretro.com/nightly/android/latest/armeabi-v7a/"
core_updater_buildbot_assets_url = "https://buildbot.libretro.com/assets/"
